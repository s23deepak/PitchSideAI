version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - OPENSEARCH_ENDPOINT=${OPENSEARCH_ENDPOINT}
      - DYNAMODB_TABLE_NAME=${DYNAMODB_TABLE_NAME:-PitchSideMatchEvents}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://pitchai:pitchai@postgres:5432/pitchai}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - LLM_BACKEND=${LLM_BACKEND:-vllm}
      - VISION_LLM_BACKEND=${VISION_LLM_BACKEND:-vllm}
      - COMMENTARY_NOTES_LLM_BACKEND=${COMMENTARY_NOTES_LLM_BACKEND:-vllm}
      - WAFER_BASE_URL=${WAFER_BASE_URL}
      - WAFER_API_KEY=${WAFER_API_KEY}
      - WAFER_MODEL=${WAFER_MODEL}
      - BRIGHTDATA_MCP_TOKEN=${BRIGHTDATA_MCP_TOKEN}
      - BRIGHTDATA_MCP_GROUPS=${BRIGHTDATA_MCP_GROUPS:-advanced_scraping}
      - DEEP_NOTES_ENABLED=${DEEP_NOTES_ENABLED:-false}
      - DEEPAGENTS_MODEL=${DEEPAGENTS_MODEL:-openai:gpt-5.4}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8001}
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    networks:
      - pitchside
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  notes-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A jobs.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - OPENSEARCH_ENDPOINT=${OPENSEARCH_ENDPOINT}
      - DYNAMODB_TABLE_NAME=${DYNAMODB_TABLE_NAME:-PitchSideMatchEvents}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://pitchai:pitchai@postgres:5432/pitchai}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - LLM_BACKEND=${LLM_BACKEND:-vllm}
      - VISION_LLM_BACKEND=${VISION_LLM_BACKEND:-vllm}
      - COMMENTARY_NOTES_LLM_BACKEND=${COMMENTARY_NOTES_LLM_BACKEND:-vllm}
      - WAFER_BASE_URL=${WAFER_BASE_URL}
      - WAFER_API_KEY=${WAFER_API_KEY}
      - WAFER_MODEL=${WAFER_MODEL}
      - BRIGHTDATA_MCP_TOKEN=${BRIGHTDATA_MCP_TOKEN}
      - BRIGHTDATA_MCP_GROUPS=${BRIGHTDATA_MCP_GROUPS:-advanced_scraping}
      - DEEP_NOTES_ENABLED=${DEEP_NOTES_ENABLED:-false}
      - DEEPAGENTS_MODEL=${DEEPAGENTS_MODEL:-openai:gpt-5.4}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8001}
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    networks:
      - pitchside
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  notes-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A jobs.celery_app.celery_app beat --loglevel=INFO
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://pitchai:pitchai@postgres:5432/pitchai}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - LLM_BACKEND=${LLM_BACKEND:-vllm}
      - VISION_LLM_BACKEND=${VISION_LLM_BACKEND:-vllm}
      - COMMENTARY_NOTES_LLM_BACKEND=${COMMENTARY_NOTES_LLM_BACKEND:-vllm}
      - DEEP_NOTES_ENABLED=${DEEP_NOTES_ENABLED:-false}
      - DEEPAGENTS_MODEL=${DEEPAGENTS_MODEL:-openai:gpt-5.4}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8001}
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    networks:
      - pitchside
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_BACKEND_URL: ""
        VITE_API_URL: ""
    ports:
      - "3000:3000"
    networks:
      - pitchside
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - pitchside
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pitchai}
      - POSTGRES_USER=${POSTGRES_USER:-pitchai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pitchai}
    networks:
      - pitchside
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  pitchside:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
