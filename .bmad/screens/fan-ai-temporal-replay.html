<nav class="hidden md:flex gap-6">
<a class="font-label-lg text-label-sm uppercase text-primary-container border-b-2 border-primary-container pb-2 hover:bg-surface-container-highest/50 transition-all px-3 py-2 rounded-lg" href="#">Fan Lens</a>

                    LIVE

<span class="font-headline-md text-headline-md font-bold text-primary-container">1</span>
</div>
<div class="font-label-lg text-label-sm uppercase text-on-surface-variant tracking-widest">PREMIER LEAGUE</div>
<div class="flex items-center gap-4">
<span class="font-headline-md text-headline-md font-bold text-primary-container">0</span>
<span class="font-headline-md text-headline-md font-bold text-tertiary">ARS</span>
</div>
</div>
</div>
</section>

<span class="material-symbols-outlined text-[18px]">skip_next</span>
</button>
</div>

<path class="opacity-70" d="M 0 0 L 50 -40 L 150 -40" fill="none" stroke="#aade00" stroke-dasharray="4 4" stroke-width="2"></path>
<circle cx="0" cy="0" fill="#aade00" r="4"></circle>
<circle cx="150" cy="-40" fill="#aade00" r="3"></circle>
</svg>
</div>
<!-- Text Bubble Analysis -->
<div class="absolute top-1/4 right-8 z-20 w-64 glass-panel p-4 rounded-xl ai-glow-border transform translate-x-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary-container text-[16px]">warning</span>

</div>
<div class="glass-panel px-4 py-2 rounded-lg flex-1">
<div class="font-label-lg text-label-sm uppercase text-on-surface-variant mb-1">Recommends</div>
<div class="font-label-lg text-label-lg text-error text-lg font-bold flex items-center gap-2">
<span class="w-3 h-4 bg-error rounded-sm inline-block"></span> Red
